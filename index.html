<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 수시 경쟁률</title>
<meta name="description" content="2027학년도 수시 실시간 경쟁률과 최근 3개년 경쟁률·입결 비교 대시보드">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234B49AC'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='17' width='4.5' height='9' rx='1'/%3E%3Crect x='13.75' y='11' width='4.5' height='15' rx='1'/%3E%3Crect x='20.5' y='6' width='4.5' height='20' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* Skydash 팔레트 — susi_final 과 동일 토큰 */
  --paper:#F4F5FC; --paper-2:#FFFFFF; --paper-3:#ECEEF9;
  --ink:#1F1F49; --ink-2:#4C4F70; --ink-3:#8B8EAE; --line:#E1E4F2; --line-2:#EDEFF8;
  --seal:#4B49AC; --seal-soft:#E7E7F8;
  --brand-2:#7DA0FA; --brand-3:#7978E9; --brand-4:#98BDFF;
  --safe:#1E9E7C; --safe-soft:#DFF3EC;
  --fit:#4B49AC; --fit-soft:#E7E7F8;
  --reach:#D98A25; --reach-soft:#FCEEDA;
  --up:#F3797E; --up-soft:#FDE6E7;
  --bad:#E0555C; --bad-soft:#FCE4E5;
  --shadow:0 1px 2px rgba(31,31,73,.05),0 8px 24px -12px rgba(75,73,172,.22);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14162B; --paper-2:#1C1F3A; --paper-3:#262B4C;
    --ink:#EAEBF7; --ink-2:#B6B9D6; --ink-3:#8589AC; --line:#343A66; --line-2:#272C4E;
    --seal:#9A98F2; --seal-soft:#2A2A55;
    --brand-2:#98BDFF; --brand-3:#9A99F0; --brand-4:#7DA0FA;
    --safe:#4FC79F; --safe-soft:#193A31;
    --fit:#98BDFF; --fit-soft:#1E2A4B;
    --reach:#EFB25E; --reach-soft:#3A2E19;
    --up:#FF9096; --up-soft:#3D2226;
    --bad:#FF8189; --bad-soft:#3B2226;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --paper:#14162B; --paper-2:#1C1F3A; --paper-3:#262B4C;
  --ink:#EAEBF7; --ink-2:#B6B9D6; --ink-3:#8589AC; --line:#343A66; --line-2:#272C4E;
  --seal:#9A98F2; --seal-soft:#2A2A55;
  --brand-2:#98BDFF; --brand-3:#9A99F0; --brand-4:#7DA0FA;
  --safe:#4FC79F; --safe-soft:#193A31;
  --fit:#98BDFF; --fit-soft:#1E2A4B;
  --reach:#EFB25E; --reach-soft:#3A2E19;
  --up:#FF9096; --up-soft:#3D2226;
  --bad:#FF8189; --bad-soft:#3B2226;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.65);
}
*{box-sizing:border-box}
html{color-scheme:light dark;height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--fit)}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* 앱 셸 — 넓은 화면에서 좌/우 칼럼이 각각 스크롤 */
@media (min-width:901px){
  body{height:100%;display:flex;flex-direction:column;overflow:hidden}
  body > header{flex:0 0 auto}
  body > main{flex:1 1 auto;min-height:0;overflow:hidden}
  .rightcol{min-width:0;height:100%;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
  .rightcol::-webkit-scrollbar{width:10px}
  .rightcol::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--paper)}
  .rightcol::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
}
.rightcol{display:flex;flex-direction:column;gap:22px}

/* header */
header{border-bottom:1px solid var(--line);background:var(--paper-2);box-shadow:0 1px 3px rgba(31,31,73,.04)}
.hwrap{width:100%;padding:16px clamp(16px,2vw,40px);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand .sub{color:var(--ink-3);font-size:13px}
.seal{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:2px solid var(--seal);border-radius:8px;color:var(--seal);font-weight:700;font-family:var(--mono);transform:rotate(-6deg);letter-spacing:-.05em;font-size:13px;line-height:1;text-align:center}
.timeline{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tl{display:flex;flex-direction:column;gap:2px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.tl small{color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tl b{font-family:var(--mono);font-weight:600;font-size:14px}
.tl.hot{border-color:var(--up);background:var(--up-soft)}
.tl.hot b{color:var(--up)}
.hsearch{position:relative;display:flex;align-items:center;gap:8px;margin-left:auto}
.hsearch input{width:clamp(240px,20vw,420px);padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:13px}
.hsearch #qcount{font-size:12px;color:var(--ink-3);font-family:var(--mono);white-space:nowrap}
@media (max-width:900px){
  .hsearch{width:100%;order:3;margin-left:0}.hsearch input{flex:1;width:auto}
  .hwrap{gap:12px}
  .timeline{width:100%;order:2;gap:8px;flex-wrap:nowrap;overflow-x:auto}
  .tl{flex:1 1 0;min-width:0;padding:5px 10px}
  .tl small{font-size:10px}
  .tl b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

/* layout */
main{width:100%;padding:18px clamp(16px,2vw,40px) 0;display:grid;grid-template-columns:clamp(320px,22vw,400px) minmax(0,1fr);gap:clamp(18px,1.6vw,32px);align-items:start}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
aside{height:100%;min-height:0;min-width:0}
.panel{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:100%;overflow:hidden;min-width:0}
.formscroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.formscroll::-webkit-scrollbar{width:10px}
.formscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--paper-2)}
.panel section{padding:16px 18px;border-top:1px solid var(--line-2);min-width:0}
.panel section:first-child{border-top:0}
.panel h2{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.panel h2 .hint{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3);margin-left:auto;font-size:12px}
.cta{flex:0 0 auto;display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);background:var(--paper-2);box-shadow:0 -8px 16px -14px rgba(31,31,73,.5)}
.cta .primary{flex:1;padding:12px;border:0;border-radius:10px;background:var(--seal);color:#fff;font-weight:600;cursor:pointer;font-size:15px;box-shadow:0 6px 16px -8px var(--seal)}
.cta .primary:disabled{background:var(--line);color:var(--ink-3);box-shadow:none;cursor:not-allowed}
.cta .ghost{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;cursor:pointer;color:var(--ink-2)}
@media (max-width:900px){
  aside{height:auto}
  body{height:auto;display:block;overflow:visible}
  main{padding-bottom:20px}
  .cta{position:sticky;bottom:0;z-index:5}
  .panel{max-height:none;overflow:visible}
  .formscroll{overflow:visible}
}
.f label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.f select,.f input{width:100%;max-width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);text-overflow:ellipsis}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.toggle input{accent-color:var(--seal)}
.help{font-size:12px;color:var(--ink-3);margin:8px 0 0;line-height:1.5}

/* 콤보박스 — 대학·전형·모집단위가 같은 조작감을 갖는다 (검색 → 제안 → 한 개 선택) */
.combo{position:relative}
.combo input{width:100%;max-width:100%;min-width:0;padding:8px 30px 8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);text-overflow:ellipsis}
.combo input:disabled{background:var(--paper-3);color:var(--ink-3);cursor:not-allowed}
.combo.sel input{border-color:var(--seal);background:var(--seal-soft);font-weight:600;color:var(--seal)}
.cclear{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:20px;height:20px;padding:0;border:0;border-radius:50%;background:var(--paper-3);color:var(--ink-2);cursor:pointer;font-size:13px;line-height:19px;text-align:center}
.cclear:hover{background:var(--line);color:var(--ink)}
.pop{position:fixed;z-index:60;margin:0;padding:4px;list-style:none;max-height:270px;overflow-y:auto;overscroll-behavior:contain;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.pop::-webkit-scrollbar{width:8px}
.pop::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.pop li{display:flex;align-items:baseline;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.pop li .l{flex:1;min-width:0;overflow-wrap:anywhere}
.pop li .m{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.pop li.on{background:var(--seal-soft);color:var(--seal);font-weight:600}
.pop li.on .m{color:var(--seal)}
.pop li.none{color:var(--ink-3);cursor:default;font-size:12.5px}

/* results */
.results{display:flex;flex-direction:column;gap:20px;min-width:0}
h2.sec{margin:2px 0 0;font-size:18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.sec small{color:var(--ink-3);font-size:13px;font-weight:400}
h2.sec .chipbtn{margin-left:auto;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--paper-2);color:var(--ink-2);font-size:12px;cursor:pointer}
h2.sec .chipbtn:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.summary{grid-template-columns:1fr}}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2);box-shadow:var(--shadow)}
.stat small{display:block;color:var(--ink-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;margin-top:2px;white-space:nowrap;letter-spacing:-.02em}
.stat b.sm{font-size:16px}
.stat i{display:block;font-style:normal;font-size:12px;color:var(--ink-2);margin-top:2px}
.stat.hero{border-color:var(--seal);background:linear-gradient(180deg,var(--seal-soft),var(--paper-2))}
.stat.hero b{color:var(--seal)}

.tablewrap{border:1px solid var(--line);border-radius:14px;background:var(--paper-2);overflow:hidden;box-shadow:var(--shadow)}
.tabbar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;align-items:center}
.tabbar .count{margin-left:auto;font-size:12px;color:var(--ink-3)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-top:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
th{font-size:11px;color:var(--ink-2);letter-spacing:.05em;text-transform:uppercase;border-top:0;background:var(--paper-3)}
td.num,th.num{text-align:right}
.bar{position:relative;height:7px;border-radius:4px;background:var(--paper-3);overflow:hidden;min-width:90px}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--brand-3);border-radius:4px}
tr.tot td{font-weight:700;background:var(--paper-3);border-top:2px solid var(--line)}

/* 모집단위 카드 */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1400px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:13px 15px 13px 19px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;min-width:0}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--c,var(--brand-3))}
.card.lv1{--c:var(--safe)} .card.lv2{--c:var(--fit)} .card.lv3{--c:var(--reach)} .card.lv4{--c:var(--up)}
.card .top{display:flex;align-items:flex-start;gap:10px}
.card .title{flex:1;min-width:0}
.card .title .t{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.card .title .d{font-size:16px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.card .title .s{font-size:11.5px;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.bignum{flex:none;text-align:right}
.bignum b{display:block;font-family:var(--mono);font-size:21px;font-weight:600;color:var(--c,var(--brand-3));line-height:1.15;letter-spacing:-.02em}
.bignum small{display:block;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.delta{font-family:var(--mono);font-size:11.5px;font-weight:600}
.delta.dn{color:var(--safe)} .delta.up{color:var(--up)} .delta.flat{color:var(--ink-3)}
.card .tscroll{overflow-x:auto;margin:0 -2px}
.card table{font-size:12.5px;min-width:290px}
.card th,.card td{padding:5px 6px}
.card th:first-child,.card td:first-child{padding-left:0}
.card th:last-child,.card td:last-child{padding-right:0}
.card tr.now td{background:var(--seal-soft);font-weight:600}
.card tr.now td:first-child{border-radius:6px 0 0 6px}
.card tr.now td:last-child{border-radius:0 6px 6px 0}
.card tr.nodata td{color:var(--ink-3)}
.card .cardfoot{font-size:11.5px;color:var(--ink-3);border-top:1px dashed var(--line-2);padding-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .rm{margin-left:auto;flex:none;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink-3);font-size:11px;cursor:pointer}
.card .rm:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.card .title .u{font-size:12px;font-weight:600;color:var(--seal)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;border:1px solid var(--line);color:var(--ink-2);background:var(--paper)}
.tag.type{border-color:transparent;background:var(--paper-3);color:var(--ink)}
.tag.warn{border-color:var(--reach);color:var(--reach)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--seal-soft);color:var(--seal);white-space:nowrap}
.pill.live{background:var(--up-soft);color:var(--up)}

.empty{padding:32px 24px;border:1px dashed var(--line);border-radius:14px;color:var(--ink-3);text-align:center;background:var(--paper-2)}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:6px}
.empty .k{display:inline;font-weight:600;color:var(--ink-2)}
.notice{padding:11px 14px;border-left:4px solid var(--reach);background:var(--reach-soft);border-radius:0 10px 10px 0;font-size:13px;color:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.legend .lv1{--c:var(--safe)} .legend .lv2{--c:var(--fit)} .legend .lv3{--c:var(--reach)} .legend .lv4{--c:var(--up)}
footer{padding:6px 0 32px;font-size:12px;color:var(--ink-3);line-height:1.7}
footer code{font-family:var(--mono);font-size:11px;background:var(--paper-3);padding:1px 5px;border-radius:4px}
.skel{padding:40px;text-align:center;color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <span class="seal" aria-hidden="true">2027<br>수시</span>
      <div>
        <h1>2027 수시 경쟁률</h1>
        <div class="sub" id="subline">데이터 불러오는 중…</div>
      </div>
    </div>
    <div class="hsearch">
      <input id="univq" type="search" list="univlist" placeholder="대학 검색 (예: 서강대)" aria-label="대학 검색" autocomplete="off" spellcheck="false">
      <datalist id="univlist"></datalist>
      <span id="qcount"></span>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
</header>

<main>
<aside>
  <div class="panel">
    <div class="formscroll">
      <section>
        <h2>대학 <span class="hint" id="univhint"></span></h2>
        <div class="combo" id="univcombo">
          <input id="univpick" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list"
                 aria-controls="univpop" aria-label="대학 검색 후 선택"
                 placeholder="대학 검색 (예: 서강대)" autocomplete="off" spellcheck="false">
          <button class="cclear" id="univclear" type="button" aria-label="대학 선택 지우기" hidden>×</button>
          <ul class="pop" id="univpop" role="listbox" aria-label="대학 목록" hidden></ul>
        </div>
        <p class="help" id="univnote"></p>
      </section>

      <section>
        <h2>전형 <span class="hint" id="jhint"></span></h2>
        <div class="combo" id="jungcombo">
          <input id="jungpick" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list"
                 aria-controls="jungpop" aria-label="전형 검색 후 선택"
                 placeholder="전형 검색 (예: 학생부교과)" autocomplete="off" spellcheck="false" disabled>
          <button class="cclear" id="jungclear" type="button" aria-label="전형 선택 지우기" hidden>×</button>
          <ul class="pop" id="jungpop" role="listbox" aria-label="전형 목록" hidden></ul>
        </div>
        <p class="help">2027학년도에 실시하는 전형입니다. 오른쪽 숫자는 모집단위 수입니다.</p>
      </section>

      <section>
        <h2>모집단위 <span class="hint" id="uhint"></span></h2>
        <div class="combo" id="unitcombo">
          <input id="unitpick" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list"
                 aria-controls="unitpop" aria-label="모집단위 검색 후 선택"
                 placeholder="학과 검색 (예: 컴퓨터, 경영)" autocomplete="off" spellcheck="false" disabled>
          <button class="cclear" id="unitclear" type="button" aria-label="모집단위 선택 지우기" hidden>×</button>

        </div>

      </section>

      <section>
        <h2>정렬 · 표시</h2>
        <div class="f"><label for="sortsel">정렬 기준</label>
          <select id="sortsel">
            <option value="ratio-desc">올해 경쟁률 높은 순</option>
            <option value="ratio-asc">올해 경쟁률 낮은 순</option>

            <option value="delta-asc">전년 대비 하락폭 큰 순</option>
            <option value="cut-asc">입결 50% 높은 순 (등급 낮은 값)</option>
            <option value="name">모집단위 이름 순</option>
            <option value="jung">전형 순</option>
          </select></div>

        <p class="help">정렬과 필터는 대시보드에 담은 모집단위에 적용됩니다.</p>

    <div class="cta">

</aside>

<div class="rightcol" id="rightcol">
  <div class="results" id="results"><div class="skel">데이터를 불러오는 중입니다…</div></div>
  <footer id="foot"></footer>
</div>
</main>

<script>
'use strict';
/* ────────────────────────────────────────────────────────────────
   2027 수시 경쟁률 대시보드

   데이터 두 축
   1) data/susi_ratio.json  — 경쟁률. 2027(실시간) + 2026/2025/2024(지난 경쟁률).
      진학사 SMART 경쟁률에서 수집. 수동 업데이트 대상(git 관리).
   2) data/ipgyeol.json     — 입결. 어디가 발표자료 2024~2026의 등록자 50%·70% 컷.
      행 = [univIdx, hakIdx, jungIdx, edu(0교과/1종합),
            2024: g50,g70,모집,경쟁률, 2025: …, 2026: …]

   두 자료는 대학명·전형명·모집단위명 표기가 달라 정규화 후 매칭한다.
   ──────────────────────────────────────────────────────────────── */

const CUR_YEAR = 2027;
const MAX_ROWS = 100;
const YEAR_OFF = { 2024: 4, 2025: 8, 2026: 12 };   // ipgyeol 행에서 연도별 시작 인덱스

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt2 = n => n == null ? '—' : (Math.round(n * 100) / 100).toFixed(2);
const fmtInt = n => n == null ? '—' : n.toLocaleString('ko-KR');
const ratioText = n => n == null ? '—' : fmt2(n) + ' : 1';

let RT = null, IP = null;
let IDX = null;                 // 정규화 인덱스
/* 선택은 대학·전형·모집단위 각각 한 개. 담은 모집단위는 basket 에 쌓인다.
   basket 항목은 {k, univKey, rowKey} — 행 자체가 아니라 키만 들고 있다가
   렌더할 때 dataOf() 로 되찾는다(대학 데이터가 갱신돼도 어긋나지 않게). */
let S = {univ:null, jung:null, unit:null, sort:'ratio-desc', onlyIp:false, basket:[]};

/* ── 정규화 ─────────────────────────────────────────────── */
function normUniv(s){
  return String(s || '').replace(/\s/g, '').replace(/대학교$/, '대');
}
function normJung(s){
  let v = String(s || '').replace(/\s/g, '');
  v = v.replace(/학생부교과/g, '교과').replace(/학생부종합/g, '종합');
  v = v.replace(/전형$/, '');
  v = v.replace(/[ⅠⅡⅢⅣ]/g, '');              // 일반Ⅰ/일반Ⅱ → 일반
  return v;
}
/* 전형 종류(교과/종합/논술/실기 등)만 뽑아낸다 — 입결 자료는 교과·종합만 있다 */
function jungKind(s){
  const v = normJung(s);
  if (/^교과/.test(v)) return 0;
  if (/^종합/.test(v)) return 1;
  return -1;
}
/* 모집단위: "인문학부 | 국어국문학과 | 사학과" → 앞부분만 */
function headUnit(s){
  return String(s || '').split('|')[0].trim().replace(/\s/g, '');
}
/* 접수단위가 단일 학과일 때만 매칭 후보로 쓴다 */
function soleSub(u){
  const raw = u['접수단위'] || u.unit2 || '';
  if (!raw || String(raw).includes('|')) return '';
  const v = String(raw).trim().replace(/\s/g, '');
  return v === headUnit(u.unit) ? '' : v;
}
function bareUnit(s){
  return String(s || '').replace(/\([^)]*\)/g, '').replace(/[·,\-\s]/g, '')
    .replace(/(학부|학과|전공|계열)$/, '');
}
/* 편집거리 — 원자료 오타(프라마나 ↔ 프리마나)까지 잇기 위한 마지막 수단 */
function editDist(a, b){
  const m = a.length, n = b.length;
  if (!m || !n) return Math.max(m, n);
  if (Math.abs(m - n) > 2) return 99;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function approxTol(s){ return Math.max(1, Math.floor(s.length * 0.2)); }
function commonPrefix(a, b){ let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; }

/* 전형명 후보 고르기.
   ① 정규화 완전일치  ② 한쪽이 다른 쪽을 접두로 포함 (일반 ↔ 일반학생 같은 개명)

   같은 종류(교과/종합)라는 이유로 넓게 붙이지 않는다. 그렇게 하면
   종합(기회균형)·종합(서강가치)처럼 입결이 공개되지 않은 전형에
   종합(일반)의 입결이 붙어버려, 없는 숫자를 있는 것처럼 보여준다. */
function matchJungName(names, target){
  const tk = normJung(target);
  const exact = names.filter(n => normJung(n) === tk);
  if (exact.length) return {names:exact, approx:false};
  const pre = names.filter(n => { const v = normJung(n); return v.startsWith(tk) || tk.startsWith(v); });
  if (pre.length){
    pre.sort((a, b) => commonPrefix(normJung(b), tk) - commonPrefix(normJung(a), tk));
    return {names:[pre[0]], approx:true};
  }
  /* 유웨이 계열 대학은 전형명에 교과/종합 구분이 없다("일반전형").
     입결 자료는 같은 전형을 "교과(일반전형)" 으로 적으므로 괄호 안만 떼어 비교한다.
     후보가 여럿이면(교과·종합 양쪽에 같은 이름) 어느 쪽인지 알 수 없어 포기한다. */
  if (jungKind(target) < 0){
    const inner = names.filter(n => {
      const v = innerJung(n);
      return v === tk || v.startsWith(tk) || tk.startsWith(v);
    });
    if (inner.length === 1) return {names:inner, approx:true};
  }
  return {names:[], approx:false};
}
/* "교과(일반전형)" → "일반" */
function innerJung(s){
  const m = String(s || '').match(/^(?:교과|종합|논술|실기|특기)\s*\((.+)\)$/);
  return normJung(m ? m[1] : s);
}

/* 모집단위 후보 고르기. pool 은 {key, item} 배열.
   완전일치 → 접두일치 → 괄호·접미어 제거 후 일치 → 편집거리(원자료 오타)

   마지막 편집거리 단계는 조건을 좁게 둔다. '수학과'와 '화학과'처럼
   한 글자 차이로 뜻이 완전히 다른 학과가 잘못 붙는 것을 막아야 한다. */
function matchUnit(pool, unitObj){
  const head = headUnit(unitObj.unit), sub = soleSub(unitObj);
  const order = (sub ? [sub, head] : [head, sub]).filter(Boolean);
  for (const key of order){
    const hit = pool.find(p => p.key === key);
    if (hit) return {hit, approx:false};
  }
  for (const key of order){
    const hit = pool.find(p => p.key.startsWith(key) || key.startsWith(p.key));
    if (hit) return {hit, approx:false};
  }
  for (const key of order){
    const bk = bareUnit(key);
    if (!bk) continue;
    const hit = pool.find(p => bareUnit(p.key) === bk);
    if (hit) return {hit, approx:false};
  }
  for (const key of order){
    if (key.length < 5) continue;                        // 짧은 학과명은 오타 보정 대상에서 뺀다
    const tol = approxTol(key);
    let best = null, bestD = 99, secondD = 99;
    for (const p of pool){
      if (p.key[0] !== key[0]) continue;                 // 첫 글자는 같아야 한다
      const d = editDist(p.key, key);
      if (d < bestD){ secondD = bestD; bestD = d; best = p; }
      else if (d < secondD) secondD = d;
    }
    if (best && bestD <= tol && bestD < secondD) return {hit:best, approx:true};
  }
  return {hit:null, approx:false};
}

/* ── 데이터 로드 ────────────────────────────────────────── */
async function boot(){
  try {
    const [a, b] = await Promise.all([
      fetch('data/susi_ratio.json', {cache:'no-cache'}).then(r => { if(!r.ok) throw new Error('susi_ratio.json ' + r.status); return r.json(); }),
      fetch('data/ipgyeol.json', {cache:'no-cache'}).then(r => { if(!r.ok) throw new Error('ipgyeol.json ' + r.status); return r.json(); })
    ]);
    RT = a; IP = b;
    buildIndex();
    initUI();
  } catch (e) {
    $('results').innerHTML = '<div class="empty"><b>데이터를 불러오지 못했습니다</b>' + esc(e.message) +
      '<br><br>로컬에서 파일을 직접 열면 브라우저가 fetch 를 막습니다. <code>python3 -m http.server</code> 같은 정적 서버로 열어주세요.</div>';
    $('subline').textContent = '데이터 로드 실패';
  }
}

function buildIndex(){
  // 입결: 대학 정규화명 → tracks 인덱스
  const univTrack = new Map();
  IP.univs.forEach((n, i) => { const k = normUniv(n); if (!univTrack.has(k)) univTrack.set(k, i); });

  // 입결 행을 univIdx 로 묶고, 그 안에서 (정규화 전형 → 행 배열)
  const byUniv = new Map();
  const rawJungOf = new Map();          // univIdx → 그 대학의 전형명 원문 목록
  for (const r of IP.rows){
    let m = byUniv.get(r[0]);
    if (!m) { m = new Map(); byUniv.set(r[0], m); rawJungOf.set(r[0], []); }
    const raw = IP.jungs[r[2]], jk = normJung(raw);
    let arr = m.get(jk);
    if (!arr) { arr = []; m.set(jk, arr); rawJungOf.get(r[0]).push(raw); }
    arr.push(r);
  }

  // 경쟁률 자료: 대학 목록
  const ratioUniv = new Map();
  for (const u of RT.universities) ratioUniv.set(normUniv(u.university), u);

  // 선택 목록 = 입결 자료의 전국 대학 ∪ 경쟁률 자료의 대학
  const list = [];
  const seen = new Set();
  IP.univs.forEach((n, i) => {
    const k = normUniv(n);
    if (seen.has(k)) return;
    seen.add(k);
    list.push({key:k, name:n, region:(IP.regions && IP.regions[i]) || '', trackIdx:i, ratio:ratioUniv.get(k) || null});
  });
  for (const [k, u] of ratioUniv){
    if (seen.has(k)) continue;
    seen.add(k);
    list.push({key:k, name:u.university, region:u.region || '', trackIdx:univTrack.has(k) ? univTrack.get(k) : -1, ratio:u});
  }
  list.sort((x, y) => {
    if (!!x.ratio !== !!y.ratio) return x.ratio ? -1 : 1;     // 데이터 있는 대학 먼저
    return x.name.localeCompare(y.name, 'ko');
  });
  IDX = {univTrack, byUniv, rawJungOf, ratioUniv, list};
}

/* ── 선택된 대학의 시즌 ─────────────────────────────────── */
function seasonsOf(uv){
  if (!uv.ratio) return {cur:null, past:new Map()};
  let cur = null; const past = new Map();
  for (const s of uv.ratio.seasons){
    if (s.year === CUR_YEAR) cur = s;
    else past.set(s.year, s);
  }
  if (!cur){                                     // 올해 자료가 없으면 가장 최근 연도를 현재로
    const ys = [...past.keys()].sort((a, b) => b - a);
    if (ys.length){ cur = past.get(ys[0]); past.delete(ys[0]); }
  }
  return {cur, past};
}

/* ── 입결 매칭 ──────────────────────────────────────────── */
function ipRowFor(uv, jungName, unitObj){
  if (!uv || uv.trackIdx < 0) return null;
  const m = IDX.byUniv.get(uv.trackIdx);
  if (!m) return null;

  // 입결 자료의 전형명(원문) 목록에서 후보를 고른다
  const raw = IDX.rawJungOf.get(uv.trackIdx) || [];
  const {names, approx: jApprox} = matchJungName(raw, jungName);
  if (!names.length) return null;

  const cand = [];
  for (const n of names){ const arr = m.get(normJung(n)); if (arr) cand.push(...arr); }
  if (!cand.length) return null;

  const pool = cand.map(r => ({key: IP.haks[r[1]], item: r}));
  const {hit, approx: uApprox} = matchUnit(pool, unitObj);
  if (!hit) return null;
  const row = hit.item.slice();
  row.approxJung = jApprox;
  row.approxUnit = uApprox;
  return row;
}

/* ── 과거 경쟁률 매칭 (susi_ratio.json 내부) ────────────── */
function pastUnitFor(season, jungName, unitObj){
  if (!season || !Array.isArray(season.details)) return null;
  const raw = season.details.map(d => d.name);
  const {names, approx: jApprox} = matchJungName(raw, jungName);
  if (!names.length) return null;

  const pool = [];
  for (const d of season.details){
    if (!names.includes(d.name)) continue;
    for (const u of d.units || []){
      if (u.isTotal) continue;
      pool.push({key: headUnit(u.unit), item: {u, d}});
    }
  }
  if (!pool.length) return null;

  const {hit, approx: uApprox} = matchUnit(pool, unitObj);
  if (!hit) return null;
  return {u: hit.item.u, d: hit.item.d, approxJung: jApprox, approxUnit: uApprox};
}

/* ── 한 모집단위의 4개년 행 만들기 ───────────────────────── */
function buildRow(uv, curSeason, past, jung, unitObj){
  const ipRow = ipRowFor(uv, jung.name, unitObj);
  const years = [];

  // 올해
  years.push({
    year: curSeason.year, now: true, live: curSeason.kind === 'live',
    recruit: unitObj.recruit, applied: unitObj.applied, ratio: unitObj.ratio,
    g50: null, g70: null, src: '경쟁률'
  });

  // 과거 3개년 (최근 → 과거)
  const pastYears = [curSeason.year - 1, curSeason.year - 2, curSeason.year - 3];
  for (const y of pastYears){
    const off = YEAR_OFF[y];
    const ipY = (ipRow && off != null) ? {g50: ipRow[off], g70: ipRow[off+1], recruit: ipRow[off+2], ratio: ipRow[off+3]} : null;
    const hit = pastUnitFor(past.get(y), jung.name, unitObj);
    let recruit = null, applied = null, ratio = null, src = null, approx = false, altJung = null;
    if (hit){
      recruit = hit.u.recruit; applied = hit.u.applied; ratio = hit.u.ratio; src = '경쟁률';
      approx = hit.approxJung || hit.approxUnit;
      if (hit.approxJung && normJung(hit.d.name) !== normJung(jung.name)) altJung = hit.d.name;
    } else if (ipY && ipY.ratio != null){
      recruit = ipY.recruit; ratio = ipY.ratio; src = '입결';
      if (recruit != null && ratio != null) applied = Math.round(recruit * ratio);
    }
    years.push({
      year: y, now: false, live: false,
      recruit, applied, ratio,
      g50: ipY ? ipY.g50 : null, g70: ipY ? ipY.g70 : null,
      src, approx, altJung
    });
  }

  const prev = years[1];
  const delta = (years[0].ratio != null && prev && prev.ratio != null) ? years[0].ratio - prev.ratio : null;
  return {
    jung: jung.name, jungCode: jung.code,
    unit: unitObj.unit, sub: (unitObj['접수단위'] || unitObj.unit2 || ''),
    ratio: unitObj.ratio, recruit: unitObj.recruit, applied: unitObj.applied,
    delta, years,
    hasIp: years.some(y => y.g50 != null || y.g70 != null),
    ipHak: ipRow ? IP.haks[ipRow[1]] : null,
    ipJung: ipRow ? IP.jungs[ipRow[2]] : null,
    ipApprox: ipRow ? !!(ipRow.approxJung || ipRow.approxUnit) : false,
    ipWhy: uv.trackIdx < 0 ? '어디가 발표자료에 없는 대학'
         : /논술|실기|특기/.test(jung.name) ? '논술·실기는 교과등급 컷 미공개'
         : /기회균|기균|고른기회|농어촌|특성화고|만학|재직|보훈|사회|기초|차상위|저소득|지역인재/.test(jung.name) ? '지원자격 제한 전형은 미공개'
         : '해당 전형·모집단위 발표자료 없음',
    altJungs: [...new Set(years.filter(y => y.altJung).map(y => y.year + ' ' + y.altJung))]
  };
}

function allRows(uv){
  const {cur, past} = seasonsOf(uv);
  if (!cur) return {cur:null, past, rows:[]};
  const rows = [];
  for (const d of cur.details){
    for (const u of d.units){
      if (u.isTotal) continue;
      rows.push(buildRow(uv, cur, past, d, u));
    }
  }
  return {cur, past, rows};
}

/* ── 콤보박스 ───────────────────────────────────────────── */
/* 대학·전형·모집단위가 같은 조작감을 갖도록 구현 하나를 공유한다.
   items() 는 {id, label, meta, search} 배열을 돌려주고, 고르면 onPick(item | null). */
function makeCombo(cfg){
  const {input, pop, clear, wrap} = cfg;
  let list = [], active = 0, open = false;

  function draw(){
    const q = input.value.trim().toLowerCase();
    const all = cfg.items() || [];
    // 이미 고른 값이 그대로 적혀 있으면 좁히지 않는다 — 다시 열었을 때 전체가 보이게
    const narrow = q && q !== String(cfg.pickedLabel() || '').toLowerCase();
    list = narrow ? all.filter(it => it.search.includes(q)) : all;
    if (active < 0 || active >= list.length) active = 0;
    pop.innerHTML = list.length
      ? list.slice(0, 300).map((it, i) =>
          `<li role="option" data-i="${i}" class="${i === active ? 'on' : ''}" aria-selected="${i === active}">` +
          `<span class="l">${esc(it.label)}</span>${it.meta ? `<span class="m">${esc(it.meta)}</span>` : ''}</li>`).join('')
        + (list.length > 300 ? `<li class="none">… 외 ${list.length - 300}개 — 검색어를 좁혀보세요</li>` : '')
      : `<li class="none">${esc(q ? '검색 결과가 없습니다' : (cfg.empty || '항목이 없습니다'))}</li>`;
  }
  function scrollActive(){ const el = pop.querySelector('li.on'); if (el) el.scrollIntoView({block:'nearest'}); }
  /* 목록은 화면 기준으로 띄운다 — 왼쪽 패널이 스크롤 컨테이너라 그 안에 두면 잘린다 */
  function place(){
    const r = input.getBoundingClientRect();
    const below = window.innerHeight - r.bottom - 10, above = r.top - 10;
    const up = below < 160 && above > below;
    pop.style.left = r.left + 'px';
    pop.style.width = r.width + 'px';
    pop.style.maxHeight = Math.max(120, Math.min(300, up ? above : below)) + 'px';
    if (up){ pop.style.top = 'auto'; pop.style.bottom = (window.innerHeight - r.top + 4) + 'px'; }
    else { pop.style.bottom = 'auto'; pop.style.top = (r.bottom + 4) + 'px'; }
  }
  function show(){ if (input.disabled) return; open = true; pop.hidden = false; input.setAttribute('aria-expanded', 'true'); draw(); place(); scrollActive(); }
  function hide(){ open = false; pop.hidden = true; input.setAttribute('aria-expanded', 'false'); }
  function pick(i){
    const it = list[i];
    if (!it) return;
    input.value = it.label;
    hide();
    cfg.onPick(it);
    const nx = cfg.next && cfg.next();       // 대학 → 전형 → 모집단위 → 추가 로 이어지게
    if (nx && !nx.disabled) nx.focus();
  }

  input.addEventListener('focus', () => { input.select(); show(); });
  input.addEventListener('input', () => { active = 0; show(); });
  const reposition = () => { if (open) place(); };
  window.addEventListener('scroll', reposition, true);   // capture — 안쪽 스크롤 컨테이너까지 따라간다
  window.addEventListener('resize', reposition);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if (!open){ show(); return; }
      active += e.key === 'ArrowDown' ? 1 : -1;
      if (active < 0) active = list.length - 1;
      if (active >= list.length) active = 0;
      draw(); place(); scrollActive();
    } else if (e.key === 'Enter'){
      if (open && list.length){ e.preventDefault(); pick(active); }
    } else if (e.key === 'Escape'){
      if (open){ e.preventDefault(); hide(); }
    }
  });
  input.addEventListener('blur', () => setTimeout(hide, 120));
  pop.addEventListener('mousedown', e => {
    const li = e.target.closest('li[data-i]');
    if (!li) return;
    e.preventDefault();                      // blur 로 목록이 닫히기 전에 고른다
    pick(+li.dataset.i);
  });
  clear.addEventListener('click', () => { cfg.onPick(null); input.focus(); });

  return {
    sync(){                                   // 선택 상태를 입력칸에 반영
      const lb = cfg.pickedLabel();
      if (document.activeElement !== input) input.value = lb || '';
      wrap.classList.toggle('sel', !!lb);
      clear.hidden = !lb;
      if (open) draw();
    }
  };
}

/* ── 선택지 ─────────────────────────────────────────────── */
function univItems(){
  return IDX.list.map(u => ({
    id: u.key, label: u.name,
    meta: (u.region || '') + (u.ratio ? '' : ' · 미수집'),
    search: (u.name + ' ' + normUniv(u.name) + ' ' + (u.region || '')).toLowerCase()
  }));
}
function jungItems(){
  const uv = curUniv();
  if (!uv || !uv.ratio) return [];
  const {cur, rows} = dataOf(uv);
  if (!cur) return [];
  const names = [];
  for (const d of cur.details) if (!names.includes(d.name)) names.push(d.name);
  const cnt = {};
  for (const r of rows) cnt[r.jung] = (cnt[r.jung] || 0) + 1;
  return names.map(n => ({id:n, label:n, meta:`${cnt[n] || 0}개`, search:String(n).toLowerCase()}));
}
function unitItems(){
  const uv = curUniv();
  if (!uv || !uv.ratio || !S.jung) return [];
  return dataOf(uv).rows.filter(r => r.jung === S.jung).map(r => ({
    id: unitKey(r), label: r.unit, meta: fmt2(r.ratio),
    search: (r.unit + ' ' + (r.sub || '')).toLowerCase()
  }));
}

/* ── 담은 목록 ──────────────────────────────────────────── */
function unitKey(r){ return r.jung + '¦' + r.unit + '¦' + r.sub; }

function addRow(uv, r){
  const k = uv.key + '¦' + unitKey(r);
  if (S.basket.some(b => b.k === k)) return false;
  S.basket.push({k, univKey: uv.key, rowKey: unitKey(r)});
  return true;
}
/* 담은 항목을 실제 행으로 되살린다. 데이터가 바뀌어 사라진 항목은 조용히 걸러낸다. */
function basketRows(){
  const out = [];
  for (const b of S.basket){
    const uv = IDX.list.find(u => u.key === b.univKey);
    if (!uv || !uv.ratio) continue;
    const r = dataOf(uv).rows.find(x => unitKey(x) === b.rowKey);
    if (r) out.push(Object.assign({}, r, {bk: b.k, univName: uv.name}));
  }
  return out;
}
function addPicked(){
  const uv = curUniv();
  if (!uv || !uv.ratio || !S.jung || !S.unit) return;
  const r = dataOf(uv).rows.find(x => unitKey(x) === S.unit);
  if (!r) return;
  const added = addRow(uv, r);
  S.unit = null;                              // 다음 모집단위를 곧바로 고를 수 있게 비운다
  refreshPanel(); render();
  note(added ? `${uv.name} · ${r.unit} 추가` : '이미 대시보드에 있는 모집단위입니다');
  $('unitpick').focus();
}
function removeFromBasket(k){
  S.basket = S.basket.filter(b => b.k !== k);
  render(); refreshPanel();
}

let noteTimer = null;
function note(msg){
  const el = $('unitnote');
  el.textContent = msg;
  el.style.color = 'var(--seal)';
  clearTimeout(noteTimer);
  noteTimer = setTimeout(refreshPanel, 2400);
}

/* ── UI ─────────────────────────────────────────────────── */
const COMBO = {};

function setUniv(key){
  S.univ = key; S.jung = null; S.unit = null;
  refreshPanel(); render();
}
function setJung(name){
  S.jung = name; S.unit = null;
  refreshPanel();
}

function initUI(){
  COMBO.univ = makeCombo({
    wrap:$('univcombo'), input:$('univpick'), pop:$('univpop'), clear:$('univclear'),
    items: univItems, empty: '대학이 없습니다',
    pickedLabel: () => { const u = curUniv(); return u ? u.name : ''; },
    next: () => $('jungpick'),
    onPick: it => setUniv(it ? it.id : null)
  });
  COMBO.jung = makeCombo({
    wrap:$('jungcombo'), input:$('jungpick'), pop:$('jungpop'), clear:$('jungclear'),
    items: jungItems, empty: '이 대학의 전형 정보가 없습니다',
    pickedLabel: () => S.jung || '',
    next: () => $('unitpick'),
    onPick: it => setJung(it ? it.id : null)
  });
  COMBO.unit = makeCombo({
    wrap:$('unitcombo'), input:$('unitpick'), pop:$('unitpop'), clear:$('unitclear'),
    items: unitItems, empty: '해당 전형의 모집단위가 없습니다',
    pickedLabel: () => {
      if (!S.unit) return '';
      const it = unitItems().find(x => x.id === S.unit);
      return it ? it.label : '';
    },
    next: () => $('add'),
    onPick: it => { S.unit = it ? it.id : null; refreshPanel(); }
  });

  const withData = IDX.list.filter(u => u.ratio).length;
  $('univhint').textContent = `전체 ${IDX.list.length}개 · 경쟁률 ${withData}개`;
  $('qcount').textContent = `경쟁률 ${withData}/${IDX.list.length}`;

  // 헤더 검색은 왼쪽 대학 선택으로 곧장 이어진다
  $('univlist').innerHTML = IDX.list.map(u => `<option value="${esc(u.name)}">${esc(u.region || '')}</option>`).join('');
  $('univq').addEventListener('change', () => {
    const q = $('univq').value.trim();
    if (!q) return;
    const hit = IDX.list.find(u => u.name === q) ||
                IDX.list.find(u => normUniv(u.name).includes(normUniv(q)));
    if (hit){ setUniv(hit.key); $('univq').value = ''; $('jungpick').focus(); }
  });

  $('sortsel').addEventListener('change', () => { S.sort = $('sortsel').value; render(); });
  $('onlyipgyeol').addEventListener('change', () => { S.onlyIp = $('onlyipgyeol').checked; render(); });
  $('add').addEventListener('click', addPicked);
  $('reset').addEventListener('click', () => {
    setJung(null);
    S.sort = 'ratio-desc'; $('sortsel').value = 'ratio-desc';
    S.onlyIp = false; $('onlyipgyeol').checked = false;
    render();
  });

  // 첫 화면 — 모집단위가 가장 많은 대학의 경쟁률 상위 3개를 담아 대시보드가 무엇인지 드러낸다
  const withRatio = IDX.list.filter(u => u.ratio);
  const sizeOf = u => {
    const s = (u.ratio.seasons || []).find(x => x.year === CUR_YEAR) || (u.ratio.seasons || [])[0];
    return s ? (s.details || []).reduce((n, d) => n + (d.units || []).length, 0) : 0;
  };
  const first = withRatio.length
    ? withRatio.reduce((a, b) => sizeOf(b) > sizeOf(a) ? b : a)
    : IDX.list[0];
  S.univ = first.key;
  if (first.ratio){
    const seed = dataOf(first).rows.filter(r => r.ratio != null).sort((a, b) => b.ratio - a.ratio);
    for (const r of seed.slice(0, 3)) addRow(first, r);
  }

  const g = RT.generatedAt ? new Date(RT.generatedAt) : null;
  $('subline').innerHTML = `2027학년도 수시 실시간 경쟁률 · 최근 3개년 경쟁률·입결 비교` +
    (g ? ` <span style="color:var(--ink-3)">— 수집 ${g.getFullYear()}.${String(g.getMonth()+1).padStart(2,'0')}.${String(g.getDate()).padStart(2,'0')} ${String(g.getHours()).padStart(2,'0')}:${String(g.getMinutes()).padStart(2,'0')}</span>` : '');

  refreshPanel();
  render();
  renderFoot();
}

function curUniv(){ return IDX.list.find(u => u.key === S.univ) || null; }

const CACHE = new Map();
function dataOf(uv){
  let d = CACHE.get(uv.key);
  if (!d){ d = allRows(uv); CACHE.set(uv.key, d); }
  return d;
}

function refreshPanel(){
  const uv = curUniv();
  $('univnote').innerHTML = uv && !uv.ratio
    ? '이 대학은 <code>data/susi_ratio.json</code> 에 아직 경쟁률이 없습니다. 수집 후 파일을 업데이트하면 자동으로 나타납니다.'
    : (uv && uv.ratio && uv.ratio.homepage ? `입학처 <a href="${esc(uv.ratio.homepage)}" target="_blank" rel="noopener">바로가기</a>` : '');

  const jungs = jungItems(), units = unitItems();
  $('jungpick').disabled = !jungs.length;
  $('unitpick').disabled = !S.jung || !units.length;
  $('jhint').textContent = jungs.length ? `${jungs.length}개` : '';
  $('uhint').textContent = S.jung ? `${units.length}개` : '';

  const el = $('unitnote');
  el.style.color = '';
  el.textContent = !uv || !uv.ratio ? '경쟁률 데이터가 없습니다.'
    : !S.jung ? '전형을 먼저 고르세요.'
    : S.unit ? '아래 [추가] 를 누르면 대시보드에 담깁니다.'
    : '비교할 모집단위를 고르세요.';

  COMBO.univ.sync(); COMBO.jung.sync(); COMBO.unit.sync();
  $('add').disabled = !(uv && uv.ratio && S.jung && S.unit);
  renderTimeline();
}

function renderTimeline(){
  const uv = curUniv(), tl = $('timeline');
  if (!uv || !uv.ratio || !uv.ratio.current){ tl.innerHTML = ''; return; }
  const c = uv.ratio.current, p = c.applicationPeriod || {};
  const out = [];
  if (p.to){
    const to = new Date(p.to), now = new Date();
    const days = Math.ceil((to - now) / 86400000);
    out.push(`<div class="tl${days >= 0 && days <= 3 ? ' hot' : ''}"><small>접수 마감</small><b>${to.getMonth()+1}/${to.getDate()} ${String(to.getHours()).padStart(2,'0')}:${String(to.getMinutes()).padStart(2,'0')}${days >= 0 ? ' · D-' + days : ' · 마감'}</b></div>`);
  }
  const {cur} = dataOf(uv);
  if (cur && cur.updatedAt && cur.updatedAt.raw){
    out.push(`<div class="tl"><small>경쟁률 기준</small><b>${esc(cur.updatedAt.raw)}</b></div>`);
  }
  tl.innerHTML = out.join('');
}

/* ── 렌더 ───────────────────────────────────────────────── */
function render(){
  const uv = curUniv(), out = $('results');
  const parts = [dashSection()];                      // 담은 모집단위 비교가 언제나 맨 위

  if (uv && !uv.ratio){
    parts.push(`<div class="empty"><b>${esc(uv.name)} — 경쟁률 데이터 없음</b>
      이 대학은 아직 <code>data/susi_ratio.json</code> 에 수집되지 않았습니다.<br>
      파일을 업데이트하고 커밋하면 배포 후 자동으로 표시됩니다.
      ${uv.trackIdx >= 0 ? '<br><br>입결(2024~2026) 자료는 있으므로, 경쟁률만 채우면 4개년 비교가 완성됩니다.' : ''}
    </div>`);
  } else if (uv){
    const {cur, rows} = dataOf(uv);
    parts.push(cur ? topSection(uv, cur, rows)
                   : '<div class="empty"><b>표시할 시즌 데이터가 없습니다</b></div>');
  }
  out.innerHTML = parts.join('');

  // 전형명을 누르면 그 전형이 왼쪽에서 선택되어 모집단위를 곧바로 고를 수 있다
  out.querySelectorAll('[data-jclick]').forEach(el => el.addEventListener('click', () => {
    setJung(el.dataset.jclick);
    $('unitpick').focus();
  }));
  out.querySelectorAll('[data-rm]').forEach(el =>
    el.addEventListener('click', () => removeFromBasket(el.dataset.rm)));
  const clr = $('basketclear');
  if (clr) clr.addEventListener('click', () => { S.basket = []; render(); refreshPanel(); });

  renderTimeline();
}

function sortRows(rows){
  const r = [...rows];
  const cut = x => { const y = x.years.find(v => v.g50 != null); return y ? y.g50 : 99; };
  const by = {
    'ratio-desc': (a, b) => (b.ratio ?? -1) - (a.ratio ?? -1),
    'ratio-asc':  (a, b) => (a.ratio ?? 1e9) - (b.ratio ?? 1e9),
    'delta-desc': (a, b) => (b.delta ?? -1e9) - (a.delta ?? -1e9),
    'delta-asc':  (a, b) => (a.delta ?? 1e9) - (b.delta ?? 1e9),
    'cut-asc':    (a, b) => cut(a) - cut(b),
    'name':       (a, b) => a.unit.localeCompare(b.unit, 'ko'),
    'jung':       (a, b) => a.jung.localeCompare(b.jung, 'ko') || (b.ratio ?? -1) - (a.ratio ?? -1)
  }[S.sort] || ((a, b) => (b.ratio ?? -1) - (a.ratio ?? -1));
  return r.sort(by);
}

/* 상단 — 올해 선택 대학 경쟁률 */
function topSection(uv, cur, rows){
  const ov = cur.overall || {};
  const live = cur.kind === 'live';
  const trend = (uv.ratio.trend || []).slice();
  const prev = trend.find(t => t.year === cur.year - 1);
  const d = (ov.ratio != null && prev && prev.ratio != null) ? ov.ratio - prev.ratio : null;

  const by = (cur.byAdmissionType || []).slice().sort((a, b) => (b.ratio ?? -1) - (a.ratio ?? -1));
  const max = Math.max(1, ...by.map(x => x.ratio ?? 0));

  // 전형별 전년 대비
  const pastSeason = uv.ratio.seasons.find(s => s.year === cur.year - 1);
  const prevOf = name => {
    if (!pastSeason) return null;
    const jk = normJung(name);
    const hit = (pastSeason.byAdmissionType || []).find(x => normJung(x.name) === jk);
    return hit ? hit.ratio : null;
  };

  const trendRow = trend.length ? `<div class="legend" style="margin-top:2px">${trend.map(t =>
    `<span style="--c:${t.year === cur.year ? 'var(--seal)' : 'var(--line)'}">${t.year} <b class="num">${fmt2(t.ratio)}</b></span>`).join('')}</div>` : '';

  return `
  <h2 class="sec">${esc(uv.name)} <small>${esc(uv.region || '')} · ${cur.year}학년도 ${esc(cur.category || '수시')}</small>
    <span class="pill${live ? ' live' : ''}">${live ? '실시간 접수중' : '확정'}</span></h2>

  <div class="summary">
    <div class="stat hero"><small>${cur.year} 전체 경쟁률</small><b>${ratioText(ov.ratio)}</b>
      <i>${d == null ? '전년 비교 불가' : deltaHtml(d) + ' 전년 ' + fmt2(prev.ratio)}</i></div>
    <div class="stat"><small>모집인원</small><b>${fmtInt(ov.recruit)}</b><i>명</i></div>
    <div class="stat"><small>지원인원</small><b>${fmtInt(ov.applied)}</b><i>명</i></div>
    <div class="stat"><small>전형 / 모집단위</small><b class="sm">${(cur.details || []).length} / ${rows.length}</b>
      <i>${cur.updatedAt && cur.updatedAt.raw ? esc(cur.updatedAt.raw) : '기준시각 미표기'}</i></div>
  </div>
  ${trendRow}

  <div class="tablewrap">
    <div class="tabbar"><b style="font-size:13px">전형별 ${cur.year} 경쟁률</b>
      <span class="count">전형명을 누르면 아래 목록이 그 전형만 남습니다</span></div>
    <div class="scroll"><table>
      <thead><tr><th>전형</th><th class="num">모집</th><th class="num">지원</th><th class="num">경쟁률</th><th style="width:18%">분포</th><th class="num">전년</th></tr></thead>
      <tbody>${by.map(x => {
        const pv = prevOf(x.name);
        const dd = (x.ratio != null && pv != null) ? x.ratio - pv : null;
        return `<tr><td><button type="button" data-jclick="${esc(x.name)}" style="border:0;background:transparent;padding:0;cursor:pointer;color:var(--fit);font-weight:600;text-align:left">${esc(x.name)}</button>
          <span style="color:var(--ink-3);font-size:11px"> ${x.unitCount || 0}개</span></td>
          <td class="num">${fmtInt(x.recruit)}</td><td class="num">${fmtInt(x.applied)}</td>
          <td class="num" style="font-weight:700">${fmt2(x.ratio)}</td>
          <td><div class="bar"><span style="width:${Math.max(2, Math.round((x.ratio || 0) / max * 100))}%"></span></div></td>
          <td class="num">${pv == null ? '—' : fmt2(pv) + ' ' + deltaHtml(dd, true)}</td></tr>`;
      }).join('')}
      <tr class="tot"><td>총계</td><td class="num">${fmtInt(ov.recruit)}</td><td class="num">${fmtInt(ov.applied)}</td>
        <td class="num">${fmt2(ov.ratio)}</td><td></td><td class="num">${prev ? fmt2(prev.ratio) : '—'}</td></tr>
      </tbody>
    </table></div>
  </div>`;
}

function deltaHtml(d, small){
  if (d == null) return '<span class="delta flat">—</span>';
  const cls = d > 0.005 ? 'up' : (d < -0.005 ? 'dn' : 'flat');
  const arrow = d > 0.005 ? '▲' : (d < -0.005 ? '▼' : '−');
  return `<span class="delta ${cls}"${small ? ' style="font-size:11px"' : ''}>${arrow}${fmt2(Math.abs(d))}</span>`;
}

/* 최상단 — 담은 모집단위의 4개년 비교. 여러 대학을 섞어 담을 수 있다. */
function dashSection(){
  const all = basketRows();
  if (!all.length){
    return `<h2 class="sec">모집단위별 4개년 비교</h2>
      <div class="empty"><b>대시보드가 비어 있습니다</b>
        왼쪽에서 <span class="k">대학 → 전형 → 모집단위</span> 를 고른 뒤 <span class="k">추가</span> 를 누르면 여기에 4개년 비교 카드가 쌓입니다.<br>
        다른 대학의 모집단위도 함께 담아 나란히 비교할 수 있습니다.</div>`;
  }
  const shown = S.onlyIp ? all.filter(r => r.hasIp) : all;
  const capped = shown.length > MAX_ROWS;
  const picked = sortRows(shown).slice(0, MAX_ROWS);

  const ratios = picked.map(r => r.ratio).filter(v => v != null).sort((a, b) => a - b);
  const q = p => ratios.length ? ratios[Math.min(ratios.length - 1, Math.floor(ratios.length * p))] : 0;
  const q1 = q(0.25), q2 = q(0.5), q3 = q(0.75);
  const lv = v => v == null ? 'lv2' : (v <= q1 ? 'lv1' : v <= q2 ? 'lv2' : v <= q3 ? 'lv3' : 'lv4');

  return `
  <h2 class="sec">모집단위별 4개년 비교 <small>${CUR_YEAR} · ${CUR_YEAR-1} · ${CUR_YEAR-2} · ${CUR_YEAR-3}</small>
    <span class="pill">${all.length}건</span>
    <button type="button" id="basketclear" class="chipbtn">전체 제거</button></h2>
  ${S.onlyIp && shown.length !== all.length
      ? `<div class="notice">입결 자료가 있는 ${shown.length}건만 보이는 중입니다. 담은 것은 ${all.length}건입니다.</div>` : ''}
  ${capped ? `<div class="notice">담은 모집단위가 ${shown.length}건입니다. 최대 ${MAX_ROWS}건까지만 표시합니다.</div>` : ''}
  <div class="legend"><span class="lv1">경쟁률 하위 25%</span><span class="lv2">25~50%</span><span class="lv3">50~75%</span><span class="lv4">상위 25%</span>
    <span style="--c:transparent;margin-left:auto;color:var(--ink-3)">입결 = 최종등록자 교과등급 상위 50%·70% 지점</span></div>
  <div class="cards">${picked.map(r => cardHtml(r, lv(r.ratio))).join('')}</div>`;
}

function cardHtml(r, lvCls){
  const subTxt = r.sub && headUnit(r.sub) !== headUnit(r.unit) ? r.sub : '';
  const estimated = r.years.some(y => y.src === '입결');
  const curYear = r.years[0] ? r.years[0].year : CUR_YEAR;
  return `<div class="card ${lvCls}">
    <div class="top">
      <div class="title">
        ${r.univName ? `<div class="u">${esc(r.univName)}</div>` : ''}
        <div class="t">${esc(r.jung)}</div>
        <div class="d">${esc(r.unit)}</div>
        ${subTxt ? `<div class="s">${esc(subTxt)}</div>` : ''}
      </div>
      <div class="bignum">
        <b>${fmt2(r.ratio)}</b><small>: 1 · ${curYear}</small>
        <div style="margin-top:3px">${deltaHtml(r.delta, true)}</div>
      </div>
    </div>
    <div class="tscroll"><table>
      <thead><tr><th>학년도</th><th class="num">경쟁률</th><th class="num">모집</th><th class="num">지원</th><th class="num">입결 50%</th><th class="num">입결 70%</th></tr></thead>
      <tbody>${r.years.map(y => {
        const none = y.ratio == null && y.g50 == null && y.g70 == null;
        return `<tr class="${y.now ? 'now' : ''}${none ? ' nodata' : ''}">
          <td>${y.year}${y.now ? (y.live ? ' <span style="color:var(--up);font-size:10px">LIVE</span>' : '') : ''}</td>
          <td class="num">${y.ratio == null ? '—' : fmt2(y.ratio)}</td>
          <td class="num">${fmtInt(y.recruit)}</td>
          <td class="num">${fmtInt(y.applied)}${y.src === '입결' ? '<span style="color:var(--ink-3)">*</span>' : ''}</td>
          <td class="num">${fmt2(y.g50)}</td>
          <td class="num">${fmt2(y.g70)}</td></tr>`;
      }).join('')}</tbody>
    </table></div>
    <div class="cardfoot">
      ${r.hasIp
        ? `<span class="tag type">입결 매칭: ${esc(r.ipJung || '')} · ${esc(r.ipHak || '')}</span>`
        : `<span class="tag" style="color:var(--ink-3)">입결 자료 없음 — ${esc(r.ipWhy)}</span>`}
      ${r.ipApprox ? '<span class="tag warn">입결 유사 매칭</span>' : ''}
      ${r.altJungs.length ? `<span class="tag warn">과거 전형명 다름: ${esc(r.altJungs.join(' / '))}</span>` : ''}
      ${estimated ? '<span class="tag" style="border-style:dashed">* 지원인원 = 모집×경쟁률 추정</span>' : ''}
      ${r.bk ? `<button type="button" class="rm" data-rm="${esc(r.bk)}">제거</button>` : ''}
    </div>
  </div>`;
}

function renderFoot(){
  const s = RT.source || {};
  $('foot').innerHTML = `
    <b>경쟁률</b> ${esc((s.current && s.current.provider) || '진학사')} — ${esc((s.current && s.current.url) || '')} · 지난 경쟁률 ${(s.past && s.past.years || []).join(', ')}학년도<br>
    <b>입결(50%·70% 컷)</b> 대입정보포털 어디가 발표자료 2024~2026 · 원본 ${esc(IP.src || '')}<br>
    경쟁률은 <code>data/susi_ratio.json</code>, 입결은 <code>data/ipgyeol.json</code> 입니다.
    경쟁률 파일을 갱신해 <code>main</code> 에 push 하면 GitHub Actions 가 다시 배포합니다.<br>
    입결 컷은 대학·전형·모집단위 이름을 정규화해 자동 매칭한 값입니다. 학과 통폐합이나 전형 개편이 있었던 모집단위는 매칭이 비어 있을 수 있으니 카드 하단의 매칭 표시를 확인하세요.`;
}

boot();
</script>
</body>
</html>
