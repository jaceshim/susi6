name: 수시 경쟁률 수집

on:
  schedule:
    # UTC 기준. 5분마다. (GitHub 스케줄러는 best-effort 라 혼잡하면 몇 분 늦게 돌 수 있습니다)
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratio-scrape
  # 앞선 실행이 아직 돌고 있으면 취소하고 새 실행을 쓴다.
  # 커밋은 맨 끝에 한 번만 하므로 중간에 취소돼도 데이터가 깨지지 않는다.
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 브라우저 다운로드가 매 실행 1분 가까이 걸리므로 캐시한다 (5분 간격을 맞추려면 필요)
      - name: Playwright 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.47.2-${{ runner.os }}

      # 챌린지를 통과한 쿠키를 다음 실행에서 재사용한다 (매번 확인 페이지를 다시 받지 않도록)
      - name: 세션 쿠키 캐시
        uses: actions/cache@v4
        with:
          path: .cache
          key: ratio-state-${{ github.run_id }}
          restore-keys: |
            ratio-state-

      - name: Playwright 설치
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i -D playwright@1.47.2
          npx playwright install --with-deps chromium

      # 러너에서 각 호스트에 닿는지, 막혔다면 어떤 종류인지 기록한다.
      # 매 실행마다 돌 필요는 없어서 수동 실행 때만 돈다.
      - name: 접속 진단
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/probe.mjs .

      # 실패해도 다음 단계로 넘어가야 진단 파일(data/status.json)이 커밋된다.
      - name: 경쟁률 수집
        id: scrape
        continue-on-error: true
        env:
          GAP_MS: ${{ vars.GAP_MS || '800' }}
        run: node scripts/scrape.mjs .

      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name  "ratio-bot"
          git config user.email "ratio-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(data): 경쟁률 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      # 커밋이 끝난 뒤에 판정한다. 실패하면 잡이 빨갛게 뜨지만 진단 파일은 이미 올라가 있다.
      - name: 결과 점검
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return null; } };
            const st = read('./data/status.json');
            if (st) console.log('status.json: ' + JSON.stringify(st).slice(0, 800));
            const d = read('./data/index.json') || {};
            const ok = (d.univs || []).filter((u) => u.ok).length;
            console.log('index.json: 대학 ' + (d.univs || []).length + '개, 수집 성공 ' + ok + '개');
            if (!ok) { console.error('수집 성공 대학이 0개입니다. data/status.json 의 reason·hostStat 을 확인하세요.'); process.exit(1); }
          "
