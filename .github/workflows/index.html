<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>수시 경쟁률 현황 · 2027학년도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* Skydash 팔레트 — 수시 여섯 장과 동일 */
  --paper:#F4F5FC; --paper-2:#FFFFFF; --paper-3:#ECEEF9;
  --ink:#1F1F49; --ink-2:#4C4F70; --ink-3:#8B8EAE; --line:#E1E4F2; --line-2:#EDEFF8;
  --seal:#4B49AC; --seal-soft:#E7E7F8;
  --brand-2:#7DA0FA; --brand-3:#7978E9; --brand-4:#98BDFF;
  --safe:#1E9E7C; --safe-soft:#DFF3EC;
  --fit:#4B49AC; --fit-soft:#E7E7F8;
  --reach:#D98A25; --reach-soft:#FCEEDA;
  --up:#F3797E; --up-soft:#FDE6E7;
  --bad:#E0555C; --bad-soft:#FCE4E5;
  --shadow:0 1px 2px rgba(31,31,73,.05),0 8px 24px -12px rgba(75,73,172,.22);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14162B; --paper-2:#1C1F3A; --paper-3:#262B4C;
    --ink:#EAEBF7; --ink-2:#B6B9D6; --ink-3:#8589AC; --line:#343A66; --line-2:#272C4E;
    --seal:#9A98F2; --seal-soft:#2A2A55;
    --brand-2:#98BDFF; --brand-3:#9A99F0; --brand-4:#7DA0FA;
    --safe:#4FC79F; --safe-soft:#193A31;
    --fit:#98BDFF; --fit-soft:#1E2A4B;
    --reach:#EFB25E; --reach-soft:#3A2E19;
    --up:#FF9096; --up-soft:#3D2226;
    --bad:#FF8189; --bad-soft:#3B2226;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --paper:#14162B; --paper-2:#1C1F3A; --paper-3:#262B4C;
  --ink:#EAEBF7; --ink-2:#B6B9D6; --ink-3:#8589AC; --line:#343A66; --line-2:#272C4E;
  --seal:#9A98F2; --seal-soft:#2A2A55;
  --brand-2:#98BDFF; --brand-3:#9A99F0; --brand-4:#7DA0FA;
  --safe:#4FC79F; --safe-soft:#193A31;
  --fit:#98BDFF; --fit-soft:#1E2A4B;
  --reach:#EFB25E; --reach-soft:#3A2E19;
  --up:#FF9096; --up-soft:#3D2226;
  --bad:#FF8189; --bad-soft:#3B2226;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.65);
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--fit)}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* 앱 셸 — 넓은 화면에서 좌·우가 각각 스크롤 */
@media (min-width:901px){
  body{height:100%;display:flex;flex-direction:column;overflow:hidden}
  body > header{flex:0 0 auto}
  body > main{flex:1 1 auto;min-height:0;overflow:hidden}
  .rightcol{min-width:0;height:100%;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
  .rightcol::-webkit-scrollbar{width:10px}
  .rightcol::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--paper)}
}
.rightcol{display:flex;flex-direction:column;gap:20px;min-width:0}

header{border-bottom:1px solid var(--line);background:var(--paper-2);box-shadow:0 1px 3px rgba(31,31,73,.04)}
.hwrap{width:100%;padding:14px clamp(14px,2vw,40px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .sub{color:var(--ink-3);font-size:12.5px}
.seal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:40px;height:40px;border:2px solid var(--seal);border-radius:8px;color:var(--seal);font-weight:700;font-family:var(--mono);transform:rotate(-6deg);letter-spacing:-.05em;font-size:11px;line-height:1.15;flex:none}
.hstat{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tl{display:flex;flex-direction:column;gap:1px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-width:0}
.tl small{color:var(--ink-3);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tl b{font-family:var(--mono);font-weight:600;font-size:14px;white-space:nowrap}
.tl.hot{border-color:var(--up);background:var(--up-soft)}
.tl.hot b{color:var(--up)}
.tl.live{border-color:var(--safe);background:var(--safe-soft)}
.tl.live b{color:var(--safe)}
.dotlive{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--safe);margin-right:5px;vertical-align:1px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

main{width:100%;padding:16px clamp(14px,2vw,40px) 0;display:grid;grid-template-columns:clamp(320px,22vw,400px) minmax(0,1fr);gap:clamp(16px,1.6vw,28px);align-items:start}
@media (max-width:900px){
  /* 모바일에서는 결과를 먼저 보여주고 입력 패널을 아래로 내린다 */
  main{grid-template-columns:minmax(0,1fr);padding-bottom:16px}
  .rightcol{order:1}
  aside{order:2}
}
main > *{min-width:0}
aside{height:100%;min-height:0}
.panel{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:100%;overflow:hidden}
.formscroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.formscroll::-webkit-scrollbar{width:10px}
.formscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--paper-2)}
.cta{flex:0 0 auto;display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line);background:var(--paper-2);box-shadow:0 -8px 16px -14px rgba(31,31,73,.5)}
.cta .primary{flex:1;padding:12px;border:0;border-radius:10px;background:var(--seal);color:#fff;font-weight:600;cursor:pointer;font-size:15px;box-shadow:0 6px 16px -8px var(--seal)}
.cta .primary[disabled]{opacity:.6;cursor:progress}
.cta .ghost{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;cursor:pointer;color:var(--ink-2)}
@media (max-width:900px){
  body{height:auto;display:block;overflow:visible}
  aside{height:auto}
  .panel{max-height:none;overflow:visible}
  .formscroll{overflow:visible}
  .cta{position:sticky;bottom:0;z-index:5}
}
.panel section{padding:14px 16px;border-top:1px solid var(--line-2)}
.panel section:first-child{border-top:0}
.panel h2{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.panel h2 .hint{font-weight:400;text-transform:none;letter-spacing:0;margin-left:auto;font-size:12px}
.f{margin-bottom:8px}
.f label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.f input,.f select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.f select{max-width:100%}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.toggle input{accent-color:var(--seal)}
.help{font-size:12px;color:var(--ink-3);margin:8px 0 0;line-height:1.5}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1 0 auto;padding:8px 6px;border:0;background:var(--paper);color:var(--ink-2);cursor:pointer;font-size:13px;min-width:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--seal);color:#fff;font-weight:600}
.addbtn{width:100%;margin-top:4px;padding:10px;border:1px solid var(--seal);border-radius:9px;background:var(--seal-soft);color:var(--seal);font-weight:600;cursor:pointer}
.addbtn[disabled]{opacity:.5;cursor:not-allowed}
.wlist{display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--paper);font-size:12.5px}
.wrow .g{flex:1;min-width:0}
.wrow .g b{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .g span{color:var(--ink-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:var(--paper-2);color:var(--ink-3);font-size:11px;cursor:pointer;white-space:nowrap;flex:none}
.xbtn:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}

.results{display:flex;flex-direction:column;gap:20px;min-width:0}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2);box-shadow:var(--shadow);min-width:0}
.stat small{display:block;color:var(--ink-3);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;margin-top:2px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat i{display:block;font-style:normal;font-size:12px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2.sec{margin:4px 0 0;font-size:17px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.sec small{color:var(--ink-3);font-size:12.5px;font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.card{position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:13px 15px 13px 19px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;min-width:0}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--c,var(--brand-3))}
.card.lo{--c:var(--safe);--cs:var(--safe-soft)}
.card.mid{--c:var(--fit);--cs:var(--fit-soft)}
.card.hi{--c:var(--reach);--cs:var(--reach-soft)}
.card.vhi{--c:var(--up);--cs:var(--up-soft)}
.card .top{display:flex;align-items:flex-start;gap:8px}
.card .title{flex:1;min-width:0}
.card .title .u{font-size:12.5px;color:var(--ink-2)}
.card .title .d{font-size:16px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.card .title .t{font-size:11.5px;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--cs,var(--paper-3));color:var(--c,var(--ink-2));white-space:nowrap}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum .r{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.03em;color:var(--c,var(--ink));line-height:1}
.bignum .r small{font-size:14px;font-weight:500;color:var(--ink-3);margin-left:2px}
.delta{font-family:var(--mono);font-size:12.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--paper-3);color:var(--ink-2);white-space:nowrap}
.delta.up{background:var(--up-soft);color:var(--up)}
.delta.flat{color:var(--ink-3)}
.cutrow{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:10px;align-items:center}
.cuts{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap;row-gap:6px}
.cuts div b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600;white-space:nowrap}
.spark{width:104px;height:42px;display:block}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);border-top:1px dashed var(--line-2);padding-top:8px}
.card .foot .dl{font-family:var(--mono)}
.card .foot .dl.hot{color:var(--up);font-weight:600}
.empty{padding:26px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-3);text-align:center;line-height:1.7}

.tablewrap{border:1px solid var(--line);border-radius:14px;background:var(--paper-2);overflow:hidden;box-shadow:var(--shadow);min-width:0}
.tabbar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;align-items:center}
.tabbar input{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:12.5px;min-width:0;flex:1 1 180px}
.tabbar .count{font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.scroll{overflow-x:auto;max-height:min(62vh,720px);overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th,td{padding:7px 10px;text-align:left;border-top:1px solid var(--line-2);white-space:nowrap}
th{font-size:10.5px;color:var(--ink-2);letter-spacing:.05em;text-transform:uppercase;border-top:0;background:var(--paper-3);position:sticky;top:0;z-index:2}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr.pinned{background:var(--seal-soft)}
.box{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--paper-2);box-shadow:var(--shadow)}
.box h3{margin:0 0 8px;font-size:14px}
.box p,.box ul{margin:0;font-size:12.5px;color:var(--ink-2)}
.box ul{padding-left:18px}
.box li{margin:3px 0}
footer{padding:4px 0 28px;font-size:12px;color:var(--ink-3);line-height:1.7}
footer .warn{font-weight:700;text-decoration:underline}

.hrefresh{padding:9px 14px;border:1px solid var(--seal);border-radius:9px;background:var(--seal-soft);color:var(--seal);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.hrefresh[disabled]{opacity:.55;cursor:progress}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--seal);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;pointer-events:auto}
.shint{position:fixed;z-index:40;display:flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--paper-2);color:var(--seal);font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px -4px rgba(31,31,73,.28);transform:translateX(-50%);transition:opacity .18s ease, visibility .18s ease}
.shint.out{opacity:0;visibility:hidden;pointer-events:none}
.shint svg{width:13px;height:13px;flex:none;animation:hintbob 1.6s ease-in-out infinite}
@keyframes hintbob{0%,100%{transform:translateY(-1px)}50%{transform:translateY(2px)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="brand">
      <span class="seal" aria-hidden="true">경쟁률<br>2027</span>
      <div><h1>수시 경쟁률 현황</h1><div class="sub" id="subline">2027학년도 수시 원서접수 · 진학사 대학별 경쟁률 집계</div></div>
    </div>
    <div class="hstat" id="hstat"></div>
    <button class="hrefresh" id="hrefresh" type="button">↻ 지금 갱신</button>
  </div>
</header>

<main>
<aside>
  <div class="panel">
    <div class="formscroll" id="formscroll">
      <section>
        <h2>관심 모집단위 추가 <span class="hint" id="wcount">0 / 6</span></h2>
        <div class="f">
          <label for="uq">대학</label>
          <input id="uq" list="ulist" placeholder="대학명 입력 (예: 중앙대)" autocomplete="off">
          <datalist id="ulist"></datalist>
        </div>
        <div class="f">
          <label for="jsel">전형</label>
          <select id="jsel"><option value="">대학을 먼저 고르세요</option></select>
        </div>
        <div class="f">
          <label for="dsel">모집단위(학과)</label>
          <select id="dsel"><option value="">전형을 먼저 고르세요</option></select>
        </div>
        <button class="addbtn" id="addbtn" type="button" disabled>목록에 추가</button>
        <p class="help">기본 6개, 최대 <b id="maxlabel">20</b>개까지 담을 수 있습니다. 같은 대학의 다른 전형·학과도 각각 담을 수 있습니다.</p>
      </section>

      <section>
        <h2>자동 갱신</h2>
        <label class="toggle"><input type="checkbox" id="autochk" checked> 자동으로 다시 불러오기</label>
        <div class="row" style="margin:10px 0 6px"><span>갱신 주기</span><span class="num" id="periodlabel">5분</span></div>
        <div class="seg" id="periodseg" role="group" aria-label="갱신 주기">
          <button type="button" data-v="60">1분</button>
          <button type="button" data-v="180">3분</button>
          <button type="button" data-v="300" aria-pressed="true">5분</button>
          <button type="button" data-v="600">10분</button>
          <button type="button" data-v="1800">30분</button>
        </div>
        <p class="help">원본 경쟁률은 대학에 따라 <b>10분~1시간 단위</b>로 갱신되고, 수집기는 15분마다 돕니다. 1분 주기로 두어도 그보다 자주 값이 바뀌지는 않습니다.</p>
      </section>

      <section>
        <h2>정렬 <span class="hint">카드 순서</span></h2>
        <div class="seg" id="sortseg" role="group" aria-label="정렬">
          <button type="button" data-v="add" aria-pressed="true">추가순</button>
          <button type="button" data-v="hi">경쟁률↓</button>
          <button type="button" data-v="lo">경쟁률↑</button>
          <button type="button" data-v="delta">변동↓</button>
        </div>
      </section>

      <section>
        <h2>담은 목록 <span class="hint"><button type="button" id="clearw" class="xbtn">모두 비우기</button></span></h2>
        <div class="wlist" id="wlist"></div>
      </section>

      <section>
        <h2>수집 상태</h2>
        <div id="srcstat" class="help"></div>
      </section>
    </div>
    <div class="cta">
      <button class="primary" id="refresh" type="button">지금 갱신</button>
      <button class="ghost" id="reset" type="button" title="설정 초기화">초기화</button>
    </div>
  </div>
</aside>

<div class="rightcol" id="rightcol">
  <div class="results" id="results"></div>
  <footer id="foot"></footer>
</div>
</main>

<button class="shint" id="hintL" type="button" hidden aria-label="입력 영역 아래로 스크롤"><span>더 있어요</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
<button class="shint" id="hintR" type="button" hidden aria-label="아래로 스크롤"><span>아래로</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
